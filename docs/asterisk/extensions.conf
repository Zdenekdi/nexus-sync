; ══════════════════════════════════════════════════════════════════════════════
; extensions.conf — Nexus Hub Dialplan
; Kontext: nexushub
;
; Příchozí hovor z veřejné sítě → Asterisk → relay zařízení (Android)
;                                           → web operátor (JsSIP) zároveň
;
; Operátor uvidí:  "Příchozí hovor pro: ALICE"
; ══════════════════════════════════════════════════════════════════════════════

[general]
static=yes
writeprotect=no

; ── Makro: přidá X-Model-Name hlavičku + Dial na relay i operátora najednou ──
; ${ARG1} = relay extension (relay1, relay2, ...)
; ${ARG2} = jméno modelky (Alice, Barbora, ...)
; ${ARG3} = operátor extension (op1, op2, ...)

[macro-relay-call]
exten => s,1,NoOp(Příchozí hovor pro modelku: ${ARG2} via ${ARG1})
 ; Přidej jméno modelky do SIP hlavičky — JsSIP ho přečte v prohlížeči
 same => n,Set(PJSIP_HEADER(add,X-Model-Name)=${ARG2})
 same => n,Set(PJSIP_HEADER(add,X-Relay-Extension)=${ARG1})
 ; Zvoní zároveň: relay telefon A webový operátor (${ARG3})
 ; Kdo zvedne první, druhý přestane zvonit
 same => n,Dial(PJSIP/${ARG1}&PJSIP/${ARG3},30,rT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,Hangup()
 same => n(busy),Busy(5)
 same => n(noanswer),Hangup(19)

; ── Kontext pro relay/operátor endpointy ──────────────────────────────────────

[nexushub]

; relay1 → Alice (jméno modelky nastavte dle DB)
exten => relay1,1,Macro(relay-call,relay1,Alice,op1)

; relay2 → Barbora
exten => relay2,1,Macro(relay-call,relay2,Barbora,op1)

; Přímé volání na operátora (interní linka)
exten => op1,1,NoOp(Příchozí hovor přímo na op1)
 same => n,Dial(PJSIP/op1,30,rT)
 same => n,Hangup()

; Fallback
exten => _X.,1,NoOp(Neznámé číslo: ${EXTEN})
 same => n,Hangup(21)

; ── Příchozí DID z veřejné sítě (trunk) ──────────────────────────────────────
; Asterisk mapuje DID číslo (telefonní číslo modelky) na správnou relay linku
; Přidejte řádek pro každou modelku:
;   exten => +420XXXXXXXXX,1,Goto(nexushub,relay1,1)

[from-trunk]
; DID čísla modelek → odpovídající relay extension
; PŘÍKLAD — upravte dle skutečných čísel:
; exten => +420111222333,1,Goto(nexushub,relay1,1)   ; Alice
; exten => +420444555666,1,Goto(nexushub,relay2,1)   ; Barbora

; Fallback — vše ostatní na relay1
exten => s,1,Goto(nexushub,relay1,1)
exten => _+420XXXXXXXXX,1,Goto(nexushub,relay1,1)
exten => _XXXXXXXXXX,1,Goto(nexushub,relay1,1)

