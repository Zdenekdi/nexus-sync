; ══════════════════════════════════════════════════════════════════════════════
; pjsip.conf — Nexus Hub VoIP Relay
; VPS: 78.141.202.139
;
; Architektura:
;   Relay Android  ←→ Asterisk (SIP UDP 5060)
;   Web Operator   ←→ Asterisk (WSS 8089 / WebRTC)
;
; Po editaci: asterisk -rx "core restart now"
; ══════════════════════════════════════════════════════════════════════════════

; ── Transporty ────────────────────────────────────────────────────────────────

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; WebSocket (nešifrovaný) — pro testovací prostředí / lokální síť
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; Encrypted WebSocket — pro produkci (vyžaduje TLS certifikát)
; Certifikáty: /etc/letsencrypt/live/YOUR_DOMAIN/
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
; cert_file=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
; privkey_file=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

; ── Šablona pro relay zařízení (Android) ──────────────────────────────────────

[relay-aor-template](!)
type=aor
max_contacts=2
qualify_frequency=60
remove_existing=yes

[relay-auth-template](!)
type=auth
auth_type=userpass

[relay-endpoint-template](!)
type=endpoint
context=nexushub
disallow=all
allow=ulaw,alaw,g722
transport=transport-udp,transport-ws,transport-wss
direct_media=no
rtp_symmetric=yes
force_rport=yes
ice_support=yes
dtls_auto_generate_cert=yes

; ── Šablona pro web operátora (JsSIP/WebRTC) ──────────────────────────────────

[weboperator-template](!)
type=endpoint
context=nexushub
disallow=all
allow=ulaw,alaw,opus
transport=transport-wss,transport-ws
direct_media=no
rtp_symmetric=yes
force_rport=yes
ice_support=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
dtls_auto_generate_cert=yes

; ── Relay zařízení ────────────────────────────────────────────────────────────

[relay1](relay-endpoint-template)
aors=relay1
auth=relay1-auth
callerid="Relay 1" <relay1>

[relay1](relay-aor-template)

[relay1-auth](relay-auth-template)
username=relay1
password=CHANGE_ME_STRONG_PASSWORD_1

[relay2](relay-endpoint-template)
aors=relay2
auth=relay2-auth
callerid="Relay 2" <relay2>

[relay2](relay-aor-template)

[relay2-auth](relay-auth-template)
username=relay2
password=CHANGE_ME_STRONG_PASSWORD_2

; ── Web operátoři ─────────────────────────────────────────────────────────────

[op1](weboperator-template)
aors=op1
auth=op1-auth
callerid="Operator 1" <op1>

[op1](relay-aor-template)

[op1-auth](relay-auth-template)
username=op1
password=CHANGE_ME_OPERATOR_PASSWORD_1
