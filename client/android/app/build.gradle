apply plugin: 'com.android.application'

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()

if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}

def majorVersion = (versionProps.getProperty('VERSION_MAJOR') ?: '0').toInteger()
def minorVersion = (versionProps.getProperty('VERSION_MINOR') ?: '1').toInteger()
def forceNextMajorFromFile = (versionProps.getProperty('FORCE_NEXT_MAJOR') ?: 'false').toBoolean()

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def isReleaseBuild = requestedTasks.any { it.contains('assemblerelease') || it.contains('bundlerelease') }
def isMajorRelease = (project.findProperty('majorRelease')?.toString()?.toBoolean() ?: false) || forceNextMajorFromFile
def skipVersionIncrement = (project.findProperty('skipVersionIncrement')?.toString()?.toBoolean() ?: false)

if (isReleaseBuild && !skipVersionIncrement) {
    if (isMajorRelease) {
        majorVersion += 1
        minorVersion = 0
        // One-shot flag: consume it after first major bump.
        versionProps.remove('FORCE_NEXT_MAJOR')
    } else {
        minorVersion += 1
    }

    versionProps.setProperty('VERSION_MAJOR', majorVersion.toString())
    versionProps.setProperty('VERSION_MINOR', minorVersion.toString())
    versionPropsFile.withOutputStream {
        versionProps.store(it, 'App version (major.minor)')
    }
}

def appVersionName = "${majorVersion}.${minorVersion}"
def appVersionCode = (majorVersion * 10000) + minorVersion
def localBuildProps = new Properties()
def localBuildPropsFile = rootProject.file("local.properties")
if (localBuildPropsFile.exists()) localBuildProps.load(new FileInputStream(localBuildPropsFile))
// GSM most (NexusInCallService) je VÝCHOZÍ VYPNUTÝ.
//
// Hovory vedeme přes SIP (NexusSipPlugin → Asterisk). Kdyby byl most zapnutý,
// soupeřil by o tytéž příchozí hovory, aplikace by si říkala o roli výchozího
// vytáčeče (nápadné oprávnění navíc) — a hlavně by hovor dodala rozbitý:
// bridge je jednosměrný, do WebRTC jde jen mikrofon telefonu. Hlas volajícího
// by vyžadoval CAPTURE_AUDIO_OUTPUT (signature|privileged), které na běžném
// telefonu získat nejde. Viz komentář v NexusInCallService.java.
//
// Pro pokusy se dá zapnout přes local.properties nebo proměnnou prostředí:
//   ENABLE_GSM_CALL_BRIDGE=true
def enableGsmCallBridge = (
    localBuildProps.getProperty("ENABLE_GSM_CALL_BRIDGE")
        ?: System.getenv("ENABLE_GSM_CALL_BRIDGE")
        ?: "false"
).toBoolean()

def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER")
if (githubRunNumber != null && !githubRunNumber.isEmpty()) {
    appVersionName = "${majorVersion}.${minorVersion}-b${githubRunNumber}"
    // Make sure we don't overflow the versionCode (max 2147483647). runNumber usually starts at 1 and goes up.
    appVersionCode = appVersionCode + githubRunNumber.toInteger()
}
def artifactBaseName = "Nexus-Relay"
def canonicalReleaseOutputDir = layout.buildDirectory.dir("outputs/apk/release")
// Keep mirrored artifacts outside app/release to avoid colliding with AGP-owned outputs.
def legacyReleaseOutputDir = file("${rootProject.projectDir}/release")
def clientRootDir = rootDir.parentFile
def npmExecutable = {
    def name = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
    // Try to find full path on macOS if simple command fails
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
        def brewPath = "/opt/homebrew/bin/npm"
        def intelBrewPath = "/usr/local/bin/npm"
        if (new File(brewPath).exists()) return brewPath
        if (new File(intelBrewPath).exists()) return intelBrewPath
    }
    return name
}()

def artifactFileName = { String versionName, String buildTypeName, String extension ->
    def debugSuffix = buildTypeName == "debug" ? "-debug" : ""
    return "${artifactBaseName}-v${versionName}${debugSuffix}.${extension}"
}

tasks.register("buildFrontendWeb", Exec) {
    group = "build"
    description = "Builds the Vite frontend from the client root."
    workingDir clientRootDir
    commandLine npmExecutable, "run", "build"

    inputs.file(new File(clientRootDir, "package.json"))
    inputs.file(new File(clientRootDir, "index.html"))
    inputs.dir(new File(clientRootDir, "src"))
    outputs.dir(new File(clientRootDir, "dist"))
}

tasks.register("syncFrontendToAndroid", Exec) {
    group = "build"
    description = "Syncs the latest web build into android/app/src/main/assets/public."
    dependsOn("buildFrontendWeb")
    workingDir clientRootDir
    commandLine npmExecutable, "run", "cap:sync"

    inputs.dir(new File(clientRootDir, "dist"))
    inputs.file(new File(clientRootDir, "scripts/sync-android-assets.js"))
    inputs.file(new File(clientRootDir, "scripts/post-cap-sync.js"))
    outputs.dir(new File(projectDir, "src/main/assets/public"))
    outputs.file(new File(projectDir, "src/main/assets/capacitor.config.json"))
}

tasks.register("syncReleaseArtifacts", Sync) {
    group = "build"
    description = "Mirrors the current release APK outputs into android/app/release to avoid stale artifacts."
    from(canonicalReleaseOutputDir) {
        include "*.apk"
        include "output-metadata.json"
        include "baselineProfiles/**"
    }
    into(legacyReleaseOutputDir)
}

// Tasks are intentionally NOT hooked into preBuild automatically.
// The NPM scripts (e.g. npm run build:android:apk) handle the Vite build and cap sync
// BEFORE invoking ./gradlew to ensure correct environment variables (like VITE_APP_VARIANT) are used.

android {
    namespace = "com.nexushub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }

    flavorDimensions "version"

    productFlavors {
        nexusFull {
            dimension "version"
            applicationId "com.nexushub.app"
            versionNameSuffix "-full"
            buildConfigField "String", "APP_VARIANT", "\"full\""
            manifestPlaceholders = [
                appName: "Nexus Hub",
                appId: "com.nexushub.app",
                enableGsmCallBridge: enableGsmCallBridge.toString()
            ]
        }
        nexusRelay {
            dimension "version"
            applicationId "com.nexushub.relay"
            versionNameSuffix "-relay"
            buildConfigField "String", "APP_VARIANT", "\"relay\""
            manifestPlaceholders = [
                appName: "Nexus Relay",
                appId: "com.nexushub.relay",
                enableGsmCallBridge: enableGsmCallBridge.toString()
            ]
        }
    }

    defaultConfig {
        applicationId "com.nexushub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // DEVICE_SECRET: load from local.properties or environment variable
        def deviceSecret = localBuildProps.getProperty("DEVICE_SECRET")
            ?: System.getenv("DEVICE_SECRET")
            ?: ""
        buildConfigField "String", "DEVICE_SECRET", "\"${deviceSecret}\""
        buildConfigField "boolean", "ENABLE_GSM_CALL_BRIDGE", enableGsmCallBridge.toString()

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signing config - čte se z local.properties nebo keystore.properties (nejsou v gitu)
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    
    def localPropsFileGlobal = rootProject.file("local.properties")
    def localPropsGlobal = new Properties()
    if (localPropsFileGlobal.exists()) {
        localPropsGlobal.load(new FileInputStream(localPropsFileGlobal))
    }

    signingConfigs {
        // Distribuované buildy se staví jako debug varianta, takže je Gradle
        // podepisoval výchozím ~/.android/debug.keystore. Ten si CI runner generuje
        // znovu při každém běhu → každý build měl JINÝ podpis a aktualizace přes
        // existující instalaci vždy skončila na INSTALL_FAILED_UPDATE_INCOMPATIBLE
        // ("Aplikace nebyla nainstalována"). Uživatel musel odinstalovat a přijít
        // o přihlášení i párování zařízení.
        //
        // Když je k dispozici stabilní klíč (v CI ze secretů), podepíšeme jím.
        // Lokálně proměnné nastavené nejsou a použije se výchozí debug keystore,
        // takže vývojářský workflow zůstává beze změny.
        debug {
            if (System.getenv("ANDROID_SIGNING_KEYSTORE") != null) {
                storeFile file(System.getenv("ANDROID_SIGNING_KEYSTORE"))
                storePassword System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
            }
        }

        release {
            // CI podepisuje ze secretů přes proměnné prostředí — stejné, jaké
            // používá debug varianta. Bez téhle větve umí release konfigurace
            // číst klíč jen z local.properties, tedy jen na vývojářském stroji,
            // a v CI by vznikl NEPODEPSANÝ build. Google Play přijímá výhradně
            // podepsaný .aab.
            if (System.getenv("ANDROID_SIGNING_KEYSTORE") != null) {
                storeFile file(System.getenv("ANDROID_SIGNING_KEYSTORE"))
                storePassword System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
            // Jinak local.properties (localPropsGlobal)
            } else if (localPropsGlobal.getProperty("KEYSTORE_FILE") != null) {
                storeFile file(localPropsGlobal.getProperty("KEYSTORE_FILE"))
                storePassword localPropsGlobal.getProperty("KEYSTORE_PASSWORD")
                keyAlias localPropsGlobal.getProperty("KEY_ALIAS")
                keyPassword localPropsGlobal.getProperty("KEY_PASSWORD")
            } else if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    // Custom APK naming: Nexus-Relay-v<major.minor>[ -debug ].apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            def vName = variant.versionName ?: android.defaultConfig.versionName ?: "0.0.0"
            def buildTypeName = variant.buildType?.name ?: ""
            outputFileName = artifactFileName(vName, buildTypeName, "apk")
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.configureEach {
        finalizedBy("syncReleaseArtifacts")
    }

    // Fix: Explicitly declare that internal AGP task should run after our sync task if they happen to share locations
    tasks.matching { it.name == "createReleaseApkListingFileRedirect" }.configureEach {
        mustRunAfter("syncReleaseArtifacts")
    }

    android.applicationVariants.all { variant ->
        def variantCap = variant.name.capitalize()
        def bundleTaskName = "bundle${variantCap}"

        tasks.matching { it.name == bundleTaskName }.configureEach {
            doFirst {
                def buildTypeName = variant.buildType?.name ?: ""
                if (buildTypeName == "debug") {
                    // Keep debug bundle output directory clean so only the latest debug artifact remains.
                    def outputDir = layout.buildDirectory.dir("outputs/bundle/${variant.dirName}").get().asFile
                    if (outputDir.exists()) {
                        outputDir.listFiles()?.findAll { it.name.startsWith("${artifactBaseName}-v") && it.name.endsWith("-debug.aab") }?.each { oldFile ->
                            if (!oldFile.delete()) {
                                logger.warn("Could not delete old debug bundle: ${oldFile.name}")
                            }
                        }
                    }
                }
            }

            doLast {
                def vName = variant.versionName ?: android.defaultConfig.versionName ?: "0.0.0"
                def buildTypeName = variant.buildType?.name ?: ""
                def outputDir = layout.buildDirectory.dir("outputs/bundle/${variant.dirName}").get().asFile
                def defaultBundleFile = file("${outputDir}/app-${variant.name}.aab")

                if (defaultBundleFile.exists()) {
                    def targetBundleFile = file("${outputDir}/${artifactFileName(vName, buildTypeName, 'aab')}")
                    if (targetBundleFile.exists()) {
                        targetBundleFile.delete()
                    }

                    if (!defaultBundleFile.renameTo(targetBundleFile)) {
                        throw new GradleException("Could not rename ${defaultBundleFile.name} to ${targetBundleFile.name}")
                    }

                    if (buildTypeName == "debug") {
                        outputDir.listFiles()?.findAll { it.name.startsWith("${artifactBaseName}-v") && it.name.endsWith("-debug.aab") && it.name != targetBundleFile.name }?.each { oldFile ->
                            if (!oldFile.delete()) {
                                logger.warn("Could not delete old debug bundle: ${oldFile.name}")
                            }
                        }
                    }
                }
            }
        }
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    // Šifrované úložiště relay tokenu/credentials (Android Keystore). Knihovna je
    // sice označená deprecated, ale je to standardní a funkční řešení pro tento účel.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    implementation project(':capacitor-android')
    // WebRTC — pro InCallService audio bridge (GSM hovor → prohlížeč)
    implementation 'io.github.webrtc-sdk:android:104.5112.09'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
