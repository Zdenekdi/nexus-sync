name: "🚀 Pipeline: Build & Deploy"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Lint server
        run: cd server && npm run lint -- --quiet

      - name: Run server tests
        run: cd server && npm test

  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Build client
        run: cd client && npx vite build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd client && npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # - name: Run Playwright tests
      #   run: npm run test:smoke
      #   env:
      #     FRONTEND_URL: http://localhost:5173
      #     TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
      #     TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}

  sync-backend:
    name: Sync Server to Backend Repo
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push subtree to nexus-backend
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=server -b server-only
          git remote add backend https://github.com/Zdenekdi/nexus-backend.git
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n x-access-token:${{ secrets.SYNC_BACKEND_TOKEN }} | base64)"
          git push backend server-only:master --force

  deploy-backend:
    name: Deploy Backend (SSH)
    runs-on: ubuntu-latest
    needs: [sync-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /root/nexus-backend
            git pull origin master
            npm ci
            ./node_modules/.bin/prisma generate
            pm2 restart nexus-backend-final
            sleep 3
            pm2 status nexus-backend-final | grep -q online && echo "Deploy OK" || exit 1

  deploy-frontend:
    name: Deploy Frontend (Firebase)
    runs-on: ubuntu-latest
    needs: [build-client] # Removed e2e-tests dependency temporarily
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install & Build
        run: |
          cd client
          npm install --legacy-peer-deps
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUS_SYNC_8D50B }}'
          channelId: live
          projectId: nexus-sync-8d50b
