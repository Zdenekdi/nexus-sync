name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Lint server
        run: cd server && npm run lint -- --quiet

      - name: Run server tests
        run: cd server && npm test

  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npx vite build

  sync-backend:
    name: Sync Server to Backend Repo
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for subtree split

      - name: Push subtree to nexus-backend
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Isolate server/ and push it to the backend repo
          git subtree split --prefix=server -b server-only
          git remote add backend https://x-access-token:${{ secrets.SYNC_BACKEND_TOKEN }}@github.com/Zdenekdi/nexus-backend.git
          git push backend server-only:master --force

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-client, sync-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /root/nexus-backend
            git checkout -- package-lock.json
            git pull origin master
            npm ci --production
            npx prisma generate
            pm2 restart nexus-backend-final
            sleep 3
            pm2 status nexus-backend-final | grep -q online && echo "Deploy OK" || exit 1
