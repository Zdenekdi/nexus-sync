name: "🚀 Pipeline: Build & Deploy"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Umožní ruční spuštění z GitHub UI nebo CLI

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Lint server
        run: cd server && npm run lint -- --quiet

      - name: Run server tests
        run: cd server && npm test

  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Build client
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npx vite build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd client && npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # - name: Run Playwright tests
      #   run: npm run test:smoke
      #   env:
      #     FRONTEND_URL: http://localhost:5173
      #     TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
      #     TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}

  # ── Android APK Build ───────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Spustí se jen při push na master (ne u PR) — build trvá ~5 minut
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js (pro Capacitor sync)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/android/**/*.gradle*', 'client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Fix deprecated jcenter and AGP versions in capacitor-updater
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' \
            client/node_modules/capacitor-updater/android/build.gradle
          sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" \
            client/node_modules/capacitor-updater/android/build.gradle
          sed -i 's/android {/android {\n    namespace "ee.forgr.capacitor_updater"/g' \
            client/node_modules/capacitor-updater/android/build.gradle

      - name: Build and Package Full APK
        env:
          VITE_APP_VARIANT: full
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleNexusFullDebug --no-daemon

      - name: Build and Package Relay APK
        env:
          VITE_APP_VARIANT: relay
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
          cp dist/index.relay.html dist/index.html
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleNexusRelayDebug --no-daemon

      - name: Rename APKs
        run: |
          FULL_APK_PATH=$(find client/android/app/build/outputs/apk/nexusFull/debug -name "*.apk" | head -1)
          RELAY_APK_PATH=$(find client/android/app/build/outputs/apk/nexusRelay/debug -name "*.apk" | head -1)
          
          cp "$FULL_APK_PATH" nexus-full-latest.apk
          cp "$RELAY_APK_PATH" nexus-relay-latest.apk

      - name: Upload APKs jako artifacts (pro ruční stažení)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apks
          path: |
            nexus-full-latest.apk
            nexus-relay-latest.apk
          retention-days: 30

  # ── Deploy APK na VPS ───────────────────────────────────────────────────────
  deploy-apk:
    name: Deploy APK to VPS
    runs-on: ubuntu-latest
    needs: [build-android, deploy-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-apks

      - name: Upload Relay APK na VPS přes API
        run: |
          echo "Waiting 15s for backend to fully stabilize after PM2 restart..."
          sleep 15
          curl --retry 5 --retry-delay 5 -f -X POST \
            "${{ secrets.API_BASE_URL }}/api/vultr/upload-apk" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_API_TOKEN }}" \
            -F "apk=@nexus-relay-latest.apk" \
            --max-time 120 \
            -o response_relay.json \
            -w "\nHTTP Status: %{http_code}\n"
          cat response_relay.json

      - name: Upload Full APK na VPS přes API
        run: |
          # Pokud endpoint ukládá soubor jen jako jedno hardcodované jméno, přemaže to, ale i tak pošleme
          curl --retry 5 --retry-delay 5 -f -X POST \
            "${{ secrets.API_BASE_URL }}/api/vultr/upload-apk" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_API_TOKEN }}" \
            -F "apk=@nexus-full-latest.apk" \
            --max-time 120 \
            -o response_full.json \
            -w "\nHTTP Status: %{http_code}\n"
          cat response_full.json

  sync-backend:
    name: Sync Server to Backend Repo
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push subtree to nexus-backend
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=server -b server-only
          git remote add backend https://github.com/Zdenekdi/nexus-backend.git
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n x-access-token:${{ secrets.SYNC_BACKEND_TOKEN }} | base64)"
          git push backend server-only:master --force

  deploy-backend:
    name: Deploy Backend (SSH)
    runs-on: ubuntu-latest
    needs: [sync-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /root/nexus-backend
            git pull origin master
            pm2 stop nexus-backend-final || true
            npm install
            ./node_modules/.bin/prisma generate
            pm2 restart nexus-backend-final || pm2 start server.js --name nexus-backend-final
            sleep 3
            pm2 status nexus-backend-final | grep -q online && echo "Deploy OK" || exit 1
            # Zajištění oprávnění pro Nginx (www-data) číst z /root složky (403 Forbidden Fix)
            chmod o+x /root || true
            chmod o+x /root/nexus-backend || true
            chmod o+x /root/nexus-backend/server || true
            chmod o+x /root/nexus-backend/server/public || true
            chmod -R o+rx /root/nexus-backend/server/public/downloads || true

  deploy-frontend:
    name: Deploy Frontend (Firebase)
    runs-on: ubuntu-latest
    needs: [build-client] # Removed e2e-tests dependency temporarily
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install & Build
        run: |
          cd client
          npm install --legacy-peer-deps
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUS_SYNC_8D50B }}'
          channelId: live
          projectId: nexus-sync-8d50b

