name: "🚀 Pipeline: Build & Deploy"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Umožní ruční spuštění z GitHub UI nebo CLI

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Secret scan
        run: npm run security:secrets

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Lint server
        run: cd server && npm run lint -- --quiet

      - name: Run Relay auth/security regression tests
        run: cd server && npm run test:security

      - name: Run server tests
        run: cd server && npm test

  # Hlídač schema driftu: postaví DB POUZE z migrací a ověří, že odpovídá
  # schema.prisma. Dřív se schéma nasazovalo přes `db push`, takže migrace
  # zůstaly pozadu (chybělo 5 tabulek vč. RefreshToken/ApiKey) a prostředí
  # postavené ze zdrojáku bylo rozbité. Tenhle job to zachytí hned v PR.
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driftcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    # Heslo držíme zvlášť a URL skládáme až za běhu — connection string s heslem
    # natvrdo by (správně) spustil secret scan, i když jde o zahazovací CI databázi.
    env:
      PGPASSWORD_CI: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Build database URL
        run: echo "DATABASE_URL=postgresql://postgres:${PGPASSWORD_CI}@localhost:5432/driftcheck" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Apply migrations to an empty database
        run: cd server && npx prisma migrate deploy

      - name: Fail if migrations don't match schema.prisma
        run: |
          cd server
          if ! npx prisma migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code > /dev/null 2>&1; then
            echo "::error::Migrace neodpovídají schema.prisma — schéma bylo nejspíš změněno přes 'prisma db push' bez migrace."
            echo "Chybějící změny (SQL, který by DB dorovnal na schéma):"
            npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
            exit 1
          fi
          echo "OK: databáze postavená z migrací odpovídá schema.prisma"

  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Lint client
        run: cd client && npm run lint

      - name: Build client
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npx vite build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Běh trvá běžně 8–11 minut. Bez tohohle limitu platí výchozích šest hodin:
    # když spadne backend, `test:api` se zavěsí na mrtvý host a úloha drží
    # runner celé odpoledne, místo aby řekla, že něco není v pořádku.
    # Stalo se to 4. 8. 2026, kdy přestal odpovídat nexus-api.myvnc.com.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd client && npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Install Playwright Browsers and system dependencies
        run: npx playwright install --with-deps

      # BEZ TOHOHLE KROKU TESTUJE CI NASAZENOU PRODUKCI, NE TENHLE PR.
      #
      # tests/helpers/mocks.js servíruje frontend z client/dist. Ten je
      # v .gitignore, takže v CI po checkoutu neexistuje — mock soubor nenajde,
      # požadavek propadne dál a skončí na nasazeném webu. Testy pak procházely
      # bez ohledu na to, co je v PR, a žádnou frontendovou regresi zachytit
      # nemohly.
      - name: Build client for e2e
        run: cd client && npm run build

      # rbac a sms-relay jedou proti živému API, ne proti mockům. Když backend
      # neodpovídá, čekají na spojení, které nikdy nenaváže — z výpadku se
      # stane zásek bez vysvětlení. Tohle to řekne za pár vteřin a nahlas.
      #
      # Úmyslně to shodí celý běh: RBAC a relay jsou bezpečnostní testy a
      # neproběhlá kontrola není totéž co kontrola v pořádku.
      - name: Check API is reachable
        run: |
          # Nejdřív pryč s lomítkem na konci, teprve pak s /api — jinak by
          # se z 'https://host/api/' stalo 'https://host/api//api/health'
          # a pojistka by hlásila výpadek i u zdravého backendu.
          API="${NEXUS_API_URL%/}"; API="${API%/api}"
          if ! curl -fsS --max-time 15 -o /dev/null "$API/api/health"; then
            echo "::error::Backend $API neodpovídá — bezpečnostní testy (rbac, sms-relay) nelze spustit."
            exit 1
          fi
        env:
          NEXUS_API_URL: ${{ secrets.NEXUS_API_URL || 'https://nexus-api.myvnc.com/api' }}

      - name: Run API relay/security tests
        run: npm run test:api
        env:
          NEXUS_API_URL: ${{ secrets.NEXUS_API_URL || 'https://nexus-api.myvnc.com/api' }}
          NEXUS_DEVICE_SECRET: ${{ secrets.NEXUS_DEVICE_SECRET }}
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}

      - name: Run Playwright tests
        run: npm run test:all:e2e
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://nexus-sync-8d50b.web.app' }}

  # ── Kontrola oprávnění v manifestech ────────────────────────────────────────
  #
  # Plná aplikace míří do Google Play. SMS a seznam hovorů tam Google schválí
  # jen aplikaci, jejíž hlavní funkce je vyžaduje — to je relay, ne aplikace
  # pro operátorky. Dokud byla oprávnění ve sdíleném manifestu, dědily je obě.
  #
  # Tohle není jen ověření změny, ale POJISTKA DO BUDOUCNA: kdo přidá SMS
  # oprávnění do src/main, dozví se to tady, ne až při zamítnutí v Obchodu.
  #
  # Běží i na PR (na rozdíl od stavby APK) a trvá vteřiny — slučuje jen
  # manifesty, nestaví aplikaci.
  android-manifest-check:
    name: Android Manifest Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle projekt odkazuje na Capacitor pluginy, které žijí
      # v client/node_modules — bez instalace balíčků a `cap sync` ty adresáře
      # neexistují a build spadne na „Configuring project ':capacitor-app'
      # without an existing directory".
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Build web assets and sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync android

      - name: Merge manifests for both flavours
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew :app:processNexusFullDebugManifest :app:processNexusRelayDebugManifest --no-daemon -q

      - name: Full app must not declare SMS or call-log permissions
        run: |
          FULL=client/android/app/build/intermediates/merged_manifests/nexusFullDebug/processNexusFullDebugManifest/AndroidManifest.xml
          RELAY=client/android/app/build/intermediates/merged_manifests/nexusRelayDebug/processNexusRelayDebugManifest/AndroidManifest.xml
          test -f "$FULL" || { echo "::error::Sloučený manifest plné aplikace nenalezen"; exit 1; }
          test -f "$RELAY" || { echo "::error::Sloučený manifest relay nenalezen"; exit 1; }

          ZAKAZANE="READ_SMS SEND_SMS RECEIVE_SMS RECEIVE_MMS WRITE_SMS READ_CALL_LOG WRITE_CALL_LOG"
          CHYBA=0
          for P in $ZAKAZANE; do
            if grep -q "android.permission.$P" "$FULL"; then
              echo "::error::Plná aplikace deklaruje $P — Google Play to schválí jen výchozí SMS aplikaci. Patří do client/android/app/src/nexusRelay/AndroidManifest.xml."
              CHYBA=1
            fi
          done

          # Kontrola opačným směrem: relay ta oprávnění mít MUSÍ, jinak
          # přestane přijímat a odesílat SMS a nikdo si toho nevšimne.
          for P in RECEIVE_SMS SEND_SMS; do
            grep -q "android.permission.$P" "$RELAY" || {
              echo "::error::Relay NEdeklaruje $P — přestala by přijímat nebo odesílat SMS."; CHYBA=1; }
          done

          [ "$CHYBA" = 0 ] && echo "OK: plná aplikace je bez SMS oprávnění, relay je má."
          exit $CHYBA

  # ── Android APK Build ───────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Spustí se jen při push na master (ne u PR) — build trvá ~5 minut
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js (pro Capacitor sync)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/android/**/*.gradle*', 'client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Verzi nastavíme jen LOKÁLNĚ pro tento build — NEcommitujeme na master.
      # master je protected (required status checks), takže přímý push z CI by byl
      # odmítnut (GH006). Monotonii versionCode navíc už zajišťuje GITHUB_RUN_NUMBER
      # v build.gradle (versionCode = major*10000 + minor + runNumber), takže
      # persistovaný bump není potřeba. versionName = 3.<minor>-b<run>.
      - name: Set Android build version (local only, no push)
        run: |
          PROPS="client/android/version.properties"
          CURRENT=$(grep "^VERSION_MINOR=" "$PROPS" | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^VERSION_MINOR=${CURRENT}$/VERSION_MINOR=${NEW}/" "$PROPS"
          MAJOR=$(grep "^VERSION_MAJOR=" "$PROPS" | cut -d= -f2)
          echo "Android build version: v${MAJOR}.${NEW}-b${GITHUB_RUN_NUMBER}"

      # Distribuované APK musí být podepsané STÁLÝM klíčem. Bez něj Gradle použije
      # výchozí debug keystore, který si runner generuje znovu při každém běhu —
      # každý build má pak jiný podpis a aktualizace přes existující instalaci
      # skončí na INSTALL_FAILED_UPDATE_INCOMPATIBLE. Radši build shodíme, než
      # abychom znovu vydali nenainstalovatelnou aktualizaci.
      - name: Decode Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 chybí — build by měl nestabilní podpis a uživatelé by aktualizaci nenainstalovali."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/nexus.keystore"
          {
            echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/signing/nexus.keystore"
            echo "ANDROID_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "ANDROID_SIGNING_KEY_PASSWORD=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
            echo "ANDROID_SIGNING_KEY_ALIAS=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Build and Package Full APK
        env:
          VITE_APP_VARIANT: full
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleNexusFullDebug --no-daemon

      - name: Build and Package Relay APK
        env:
          VITE_APP_VARIANT: relay
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
          cp dist/index.relay.html dist/index.html
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleNexusRelayDebug --no-daemon

      - name: Rename APKs
        run: |
          FULL_APK_PATH=$(find client/android/app/build/outputs/apk/nexusFull/debug -name "*.apk" | head -1)
          RELAY_APK_PATH=$(find client/android/app/build/outputs/apk/nexusRelay/debug -name "*.apk" | head -1)
          
          cp "$FULL_APK_PATH" nexus-full-latest.apk
          cp "$RELAY_APK_PATH" nexus-relay-latest.apk

      # Pojistka: ověř, že APK opravdu podepsal očekávaný klíč. Kdyby konfigurace
      # podepisování někdy tiše vypadla, Gradle by sáhl po výchozím debug keystoru
      # a my bychom zase vydali build, který nejde nainstalovat jako aktualizace.
      - name: Verify APKs are signed with the stable key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -v -keystore "$ANDROID_SIGNING_KEYSTORE" \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' :' | tr 'A-Z' 'a-z')
          for apk in nexus-full-latest.apk nexus-relay-latest.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ' ' | tr 'A-Z' 'a-z')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$apk je podepsané jiným klíčem ($ACTUAL != $EXPECTED) — aktualizace by nešly nainstalovat."
              exit 1
            fi
            echo "OK: $apk podepsáno očekávaným klíčem"
          done

      - name: Upload APKs jako artifacts (pro ruční stažení)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apks
          path: |
            nexus-full-latest.apk
            nexus-relay-latest.apk
          retention-days: 30

  # ── Deploy APK na VPS ───────────────────────────────────────────────────────
  deploy-apk:
    name: Deploy APK to VPS
    runs-on: ubuntu-latest
    needs: [build-android, deploy-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-apks

      - name: Upload Relay APK na VPS přes API
        run: |
          echo "Waiting 15s for backend to fully stabilize after PM2 restart..."
          sleep 15
          curl --retry 5 --retry-delay 5 -f -X POST \
            "${{ secrets.API_BASE_URL }}/api/vultr/upload-apk" \
            -H "Authorization: Bearer ${{ secrets.APK_DEPLOY_TOKEN }}" \
            -F "apk=@nexus-relay-latest.apk" \
            --max-time 120 \
            -o response_relay.json \
            -w "\nHTTP Status: %{http_code}\n"
          cat response_relay.json

      - name: Upload Full APK na VPS přes API
        run: |
          # Pokud endpoint ukládá soubor jen jako jedno hardcodované jméno, přemaže to, ale i tak pošleme
          curl --retry 5 --retry-delay 5 -f -X POST \
            "${{ secrets.API_BASE_URL }}/api/vultr/upload-apk" \
            -H "Authorization: Bearer ${{ secrets.APK_DEPLOY_TOKEN }}" \
            -F "apk=@nexus-full-latest.apk" \
            --max-time 120 \
            -o response_full.json \
            -w "\nHTTP Status: %{http_code}\n"
          cat response_full.json

  sync-backend:
    name: Sync Server to Backend Repo
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push subtree to nexus-backend
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=server -b server-only
          git remote add backend https://github.com/Zdenekdi/nexus-backend.git
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n x-access-token:${{ secrets.SYNC_BACKEND_TOKEN }} | base64)"
          git push backend server-only:master --force

  deploy-backend:
    name: Deploy Backend (SSH)
    runs-on: ubuntu-latest
    needs: [sync-backend]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /root/nexus-backend
            git pull origin master
            if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ] && [ -z "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]; then
              echo "STRIPE_SECRET_KEY is configured, but STRIPE_WEBHOOK_SECRET is missing. Refusing to deploy billing without webhook verification."
              exit 1
            fi
            if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ] && [ -z "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" ]; then
              echo "STRIPE_SECRET_KEY is configured, but STRIPE_PUBLISHABLE_KEY is missing. Refusing to deploy incomplete billing config."
              exit 1
            fi
            if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
              touch .env
              grep -vE '^(STRIPE_PUBLISHABLE_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|REQUIRE_STRIPE_CONFIG)=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
              echo "REQUIRE_STRIPE_CONFIG=true" >> .env
            fi
            # Token pro nahrávání APK z CI — server ho musí znát, aby upload prošel.
            # Doplníme ho sem ze secretu, ať se nemusí ručně editovat .env na serveru
            # (a ať se nemůže rozejít s hodnotou, kterou posílá CI).
            if [ -n "${{ secrets.APK_DEPLOY_TOKEN }}" ]; then
              touch .env
              grep -vE '^APK_DEPLOY_TOKEN=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "APK_DEPLOY_TOKEN=${{ secrets.APK_DEPLOY_TOKEN }}" >> .env
            fi
            STRICT_RUNTIME_SECRETS=true node scripts/audit-runtime-secrets.js
            npm install
            ./node_modules/.bin/prisma generate
            # Aplikuj čekající migrace na prod DB. Bez tohohle kroku se regeneroval jen
            # Prisma klient (podle schématu), ale DB zůstala pozadu → dotazy na nové
            # tabulky/relace (např. GpsTrackerLocation) padaly na 500. migrate deploy je
            # bezpečný (jen aplikuje již vytvořené migrace, nic negeneruje/neshazuje).
            ./node_modules/.bin/prisma migrate deploy
            pm2 restart nexus-backend-final --update-env || pm2 start server.js --name nexus-backend-final
            sleep 3
            pm2 status nexus-backend-final | grep -q online && echo "Deploy OK" || exit 1
            # Zajištění oprávnění pro Nginx (www-data) číst z /root složky (403 Forbidden Fix)
            chmod o+x /root || true
            chmod o+x /root/nexus-backend || true
            chmod o+x /root/nexus-backend/server || true
            chmod o+x /root/nexus-backend/server/public || true
            chmod -R o+rx /root/nexus-backend/server/public/downloads || true

  deploy-frontend:
    name: Deploy Frontend (Firebase)
    runs-on: ubuntu-latest
    needs: [build-client] # Removed e2e-tests dependency temporarily
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install & Build
        run: |
          cd client
          npm install --legacy-peer-deps
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUS_SYNC_8D50B }}'
          channelId: live
          projectId: nexus-sync-8d50b

  # ── Backup / restore readiness audit ──────────────────────────────────────────
  backup-restore-audit:
    name: Backup / Restore Readiness Audit
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      # CI runner nemá přístup k produkčním zálohám ani k restore DB (a prod DB
      # creds do efemérního CI nepatří). Tady běží jen ADVISORY kontrola statické
      # konfigurace (dostupnost pg nástrojů, zapisovatelný dir, formát retention).
      # STRICT readiness (existence + integrita reálné zálohy) se ověřuje na VPS
      # přímo v server/scripts/backup-postgres.sh při každém běhu zálohy.
      - name: Backup/restore config sanity (advisory)
        run: node server/scripts/audit-backup-restore.js
        env:
          BACKUP_DIR:     '/tmp/nexus-backups'
          RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS || '30' }}

  # ── Android Relay field test (post-deploy liveness check) ─────────────────────
  relay-field-test:
    name: Android Relay Field Test
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: >
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      vars.RELAY_FIELD_TEST_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Wait for backend to stabilize
        run: sleep 20

      - name: Run relay field test
        run: bash scripts/relay-field-test.sh
        env:
          # Relay phone identity — no Bearer token, only installationId + secret
          API_BASE_URL:            ${{ secrets.API_BASE_URL }}
          RELAY_INSTALLATION_ID:   ${{ secrets.RELAY_INSTALLATION_ID }}
          RELAY_PROFILE_ID:        ${{ secrets.RELAY_PROFILE_ID }}
          DEVICE_SECRET:           ${{ secrets.NEXUS_DEVICE_SECRET }}
          CALLER_PHONE:            ${{ vars.RELAY_TEST_CALLER_PHONE || '+420000000001' }}
          FIELD_TEST_STRICT:       'true'
          # Optional: operator/manager read-only access to verify DB persistence
          RELAY_CHECKER_EMAIL:     ${{ secrets.RELAY_CHECKER_EMAIL }}
          RELAY_CHECKER_PASSWORD:  ${{ secrets.RELAY_CHECKER_PASSWORD }}

      - name: Run strict operational health smoke
        run: node server/scripts/audit-operational-health.js
        env:
          OPS_API_BASE_URL:           ${{ secrets.API_BASE_URL }}
          # App Owner login for /admin/operational-health (admin endpoint)
          OPS_OWNER_EMAIL:            ${{ secrets.TEST_OWNER_EMAIL }}
          OPS_OWNER_PASSWORD:         ${{ secrets.TEST_OWNER_PASSWORD }}
          # Relay phone identity for relay-specific checks (no manager token)
          OPS_RELAY_PROFILE_ID:       ${{ secrets.RELAY_PROFILE_ID }}
          OPS_RELAY_INSTALLATION_ID:  ${{ secrets.RELAY_INSTALLATION_ID }}
          OPS_DEVICE_SECRET:          ${{ secrets.NEXUS_DEVICE_SECRET }}
          OPS_SMOKE_CALLER:           ${{ vars.RELAY_TEST_CALLER_PHONE || '+420000000001' }}
          OPS_MAX_MESSAGE_AGE_DAYS:   '7'
          STRICT_OPERATIONAL_HEALTH:  'true'


