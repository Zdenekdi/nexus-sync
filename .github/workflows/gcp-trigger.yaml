# ================================================================================
# gcp-trigger.yaml — GitHub Actions Workflow to trigger Google Cloud Build
# ================================================================================

name: "☁️ Pipeline: GCP Cloud Build"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  trigger-gcb:
    name: Trigger GCB Pipeline
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check Secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_ENV"
          else
            echo "has_key=false" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to Google Cloud
        if: env.has_key == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Vyžaduje Service Account Key uložený v GitHub Secrets

      - name: Set up Cloud SDK
        if: env.has_key == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger Cloud Build
        if: env.has_key == 'true'
        run: |
          # Spustí definovaný trigger v GCP na základě názvu větve
          BRANCH_NAME="${{ github.ref_name || github.head_ref }}"
          echo "Triggering Google Cloud Build for branch: $BRANCH_NAME..."
          
          gcloud builds triggers run deploy-on-push \
            --branch="$BRANCH_NAME" \
            --region="europe-west3"
