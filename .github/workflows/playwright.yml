name: "🧪 QA: E2E Testing Suite"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Install client dependencies
      run: cd client && npm install --legacy-peer-deps --prefer-offline --no-audit
    - name: Build client dist for mocked UI routes
      run: cd client && npm run build
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'client/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      timeout-minutes: 20
      run: npx playwright install --with-deps
    # Testy proti živému API (rbac, sms-relay) běží JEN v ci.yml, kde k nim
    # patří zahazovací backend s vlastní databází. Tady se schválně nespouští:
    # dvakrát totéž nic nepřidá a hlavně mířily na PRODUKČNÍ API, do kterého
    # při každém PR zapisovaly testovací vazby zařízení a testovací SMS.
    #
    # Tenhle workflow zůstává u sady proti mockům a lokálnímu client/dist.
    - name: Run Playwright tests
      run: npm run test:all:e2e
      env:
        FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://nexus-sync-8d50b.web.app' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
