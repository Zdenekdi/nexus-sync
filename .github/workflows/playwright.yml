name: "🧪 QA: E2E Testing Suite"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run API relay/security tests
      run: npm run test:api
      env:
        NEXUS_API_URL: ${{ secrets.NEXUS_API_URL || 'https://nexus-api.myvnc.com/api' }}
        NEXUS_DEVICE_SECRET: ${{ secrets.NEXUS_DEVICE_SECRET }}
        TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
        TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
    - name: Run Playwright tests
      run: npm run test:all:e2e
      env:
        FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://nexus-sync-8d50b.web.app' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
