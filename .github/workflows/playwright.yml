name: "🧪 QA: E2E Testing Suite"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Install client dependencies
      run: cd client && npm install --legacy-peer-deps --prefer-offline --no-audit
    - name: Build client dist for mocked UI routes
      run: cd client && npm run build
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'client/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      timeout-minutes: 20
      run: npx playwright install --with-deps
    # Stejná pojistka jako v ci.yml. Tenhle workflow dělá totéž a bez ní
    # 4. 8. 2026 vyčerpal celý hodinový limit úlohy, protože se test:api
    # zavěsil na nedostupný backend.
    - name: Check API is reachable
      run: |
        API="${NEXUS_API_URL%/api}"
        if ! curl -fsS --max-time 15 -o /dev/null "$API/api/health"; then
          echo "::error::Backend $API neodpovídá — bezpečnostní testy (rbac, sms-relay) nelze spustit."
          exit 1
        fi
      env:
        NEXUS_API_URL: ${{ secrets.NEXUS_API_URL || 'https://nexus-api.myvnc.com/api' }}

    - name: Run API relay/security tests
      run: npm run test:api
      env:
        NEXUS_API_URL: ${{ secrets.NEXUS_API_URL || 'https://nexus-api.myvnc.com/api' }}
        NEXUS_DEVICE_SECRET: ${{ secrets.NEXUS_DEVICE_SECRET }}
        TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
        TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
    - name: Run Playwright tests
      run: npm run test:all:e2e
      env:
        FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://nexus-sync-8d50b.web.app' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
