# Podepsaný .aab pro Google Play — POUZE RUČNÍ SPUŠTĚNÍ
#
# Proč ne automaticky při každém pushu do masteru:
#   1. Vydání do Play je nevratné. Jakmile se verze nahraje, versionCode se
#      spotřebuje a už ho nikdy nepoužiješ. Build při každém commitu by je
#      pálil po desítkách.
#   2. Každý běh sahá na podepisovací klíč. Čím míň běhů, tím míň příležitostí
#      ho vystavit.
#   3. Podepsaný build je hodnotný artefakt, ne průběžná kontrola. Že se kód
#      přeloží, hlídá build-android při každém pushu.
#
# Spuštění: Actions → „Release AAB pro Google Play" → Run workflow.
#
# CO TENHLE WORKFLOW NEDĚLÁ: nic do Google Play nenahrává. Vyrobí soubor
# a připne ho jako artefakt. Nahrání zůstává ruční krok — vyžaduje vývojářský
# účet a odsouhlasení prohlášení (poloha na pozadí, formulář Data safety),
# což je rozhodnutí člověka, ne CI.
name: Release AAB pro Google Play

on:
  workflow_dispatch:
    inputs:
      poznamka:
        description: 'K čemu je tenhle build (jen pro dohledání v historii)'
        required: false
        default: ''
      postavit_relay:
        description: 'Postavit i relay AAB (do Play NEPATŘÍ — má SMS oprávnění)'
        type: boolean
        required: false
        default: false

jobs:
  release-aab:
    name: Podepsaný AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/android/**/*.gradle*', 'client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Bez klíče nemá smysl pokračovat: Google Play nepodepsaný .aab odmítne
      # a nepodepsaný soubor by se jen tvářil jako hotový výsledek.
      - name: Decode Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 chybí — .aab by byl nepodepsaný a Play by ho odmítl."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/nexus.keystore"
          {
            echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/signing/nexus.keystore"
            echo "ANDROID_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "ANDROID_SIGNING_KEY_PASSWORD=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
            echo "ANDROID_SIGNING_KEY_ALIAS=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Verze buildu
        run: |
          PROPS="client/android/version.properties"
          MAJOR=$(grep "^VERSION_MAJOR=" "$PROPS" | cut -d= -f2)
          MINOR=$(grep "^VERSION_MINOR=" "$PROPS" | cut -d= -f2)
          echo "VERZE=v${MAJOR}.${MINOR}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Verze: v${MAJOR}.${MINOR}-b${GITHUB_RUN_NUMBER}"
          echo "Poznámka: ${{ inputs.poznamka }}"

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      # Do Play jde POUZE plná aplikace. Relay má SMS a call-log oprávnění,
      # která Google schvaluje jen u aplikace, jejíž hlavní funkcí je SMS —
      # proto se distribuuje mimo obchod. Hlídá to úloha android-manifest-check.
      - name: Build full AAB (release)
        env:
          VITE_APP_VARIANT: full
        run: |
          cd client
          export VITE_APP_VERSION="${VERZE}"
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleNexusFullRelease --no-daemon

      - name: Build relay AAB (release)
        if: ${{ inputs.postavit_relay }}
        env:
          VITE_APP_VARIANT: relay
        run: |
          cd client
          export VITE_APP_VERSION="${VERZE}"
          npm run build
          cp dist/index.relay.html dist/index.html
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleNexusRelayRelease --no-daemon

      - name: Posbírat AAB
        run: |
          mkdir -p vystup
          FULL=$(find client/android/app/build/outputs/bundle -path '*nexusFullRelease*' -name '*.aab' | head -1)
          if [ -z "$FULL" ]; then
            echo "::error::Plný .aab se nevyrobil — hledáno v client/android/app/build/outputs/bundle"
            exit 1
          fi
          cp "$FULL" "vystup/nexus-hub-${VERZE}.aab"
          if [ "${{ inputs.postavit_relay }}" = "true" ]; then
            RELAY=$(find client/android/app/build/outputs/bundle -path '*nexusRelayRelease*' -name '*.aab' | head -1)
            [ -n "$RELAY" ] && cp "$RELAY" "vystup/nexus-relay-${VERZE}.aab"
          fi
          ls -lh vystup/

      # Stejná pojistka jako u APK: kdyby konfigurace podepisování někdy tiše
      # vypadla, vznikl by soubor podepsaný jiným (nebo žádným) klíčem. U Play
      # to znamená odmítnutý upload — a zjistilo by se to až při nahrávání.
      # apksigner .aab neumí, otisk se proto čte přes keytool.
      - name: Ověřit podpis
        run: |
          OCEKAVANY=$(keytool -list -v -keystore "$ANDROID_SIGNING_KEYSTORE" \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' :' | tr 'A-Z' 'a-z')
          if [ -z "$OCEKAVANY" ]; then
            echo "::error::Z keystoru se nepodařilo přečíst otisk klíče."
            exit 1
          fi
          for aab in vystup/*.aab; do
            SKUTECNY=$(keytool -printcert -jarfile "$aab" 2>/dev/null \
              | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' :' | tr 'A-Z' 'a-z')
            if [ "$SKUTECNY" != "$OCEKAVANY" ]; then
              echo "::error::$aab je podepsaný jiným klíčem — Play takový upload odmítne."
              exit 1
            fi
            echo "OK: $aab podepsán očekávaným klíčem."
          done

      - name: Připnout AAB jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: nexus-aab-${{ github.run_number }}
          path: vystup/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Co dál
        run: |
          {
            echo "### AAB je hotový: \`${VERZE}\`"
            echo ""
            echo "Stáhni si ho z artefaktů tohoto běhu a nahraj ručně do Play Console."
            echo ""
            echo "Tenhle workflow do Play nic nenahrává. Před prvním vydáním je potřeba:"
            echo "- vývojářský účet a zapnuté Play App Signing,"
            echo "- prohlášení k poloze na pozadí včetně videa,"
            echo "- vyplněný formulář Data safety,"
            echo "- veřejnou URL zásad ochrany osobních údajů."
            echo ""
            echo "Relay aplikace do Play **nepatří** — má SMS a call-log oprávnění."
          } >> "$GITHUB_STEP_SUMMARY"
