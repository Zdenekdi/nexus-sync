# ================================================================================
# cloudbuild.yaml — Google Cloud Build Configuration for Nexus Hub
# ================================================================================

steps:
  # ------------------------------------------------------------------------------
  # KROK 0: Obnovení cache (volitelné — vyžaduje nastavenou substitution _CACHE_BUCKET)
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'restore-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -z "${_CACHE_BUCKET}" ]; then
          echo "Restoring npm cache from gs://${_CACHE_BUCKET}..."
          gsutil cp gs://${_CACHE_BUCKET}/cache/node_modules_cache.tar.gz . || echo "No cache found"
          if [ -f node_modules_cache.tar.gz ]; then
            tar -xzf node_modules_cache.tar.gz
            echo "Cache restored successfully."
          fi
        else
          echo "Cache bucket not defined, skipping restore."
        fi
    waitFor: ['-']

  # ------------------------------------------------------------------------------
  # KROK 1: Instalace závislostí a Linting
  # ------------------------------------------------------------------------------
  # A. Instalace závislostí klientské části (s --legacy-peer-deps kvůli starším knihovnám Capacitoru)
  - name: 'node:20'
    id: 'install-client'
    dir: 'client'
    entrypoint: 'npm'
    args: ['ci', '--legacy-peer-deps']
    waitFor: ['restore-cache']

  # B. Instalace závislostí serverové části
  - name: 'node:20'
    id: 'install-server'
    dir: 'server'
    entrypoint: 'npm'
    args: ['ci']
    waitFor: ['restore-cache']

  # C. Spuštění linteru pro klientskou část
  - name: 'node:20'
    id: 'lint-client'
    dir: 'client'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor: ['install-client']

  # D. Spuštění linteru pro serverovou část
  - name: 'node:20'
    id: 'lint-server'
    dir: 'server'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor: ['install-server']

  # ------------------------------------------------------------------------------
  # KROK 2: Automatizované QA testy (Unit & Integration)
  # ------------------------------------------------------------------------------
  # Spuštění backend testů (Jest) v CI režimu
  - name: 'node:20'
    id: 'run-server-tests'
    dir: 'server'
    entrypoint: 'npm'
    args: ['run', 'test:ci']
    waitFor: ['install-server', 'lint-server']

  # ------------------------------------------------------------------------------
  # KROK 3: Build statických aktiv (Client App)
  # ------------------------------------------------------------------------------
  - name: 'node:20'
    id: 'build-client'
    dir: 'client'
    entrypoint: 'npm'
    args: ['run', 'build']
    waitFor: ['install-client', 'lint-client']

  # ------------------------------------------------------------------------------
  # KROK 4: Uložení aktualizované cache zpět do GCS
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'save-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -z "${_CACHE_BUCKET}" ]; then
          echo "Creating node_modules archive..."
          tar -czf node_modules_cache.tar.gz client/node_modules server/node_modules
          echo "Uploading archive to gs://${_CACHE_BUCKET}/cache/node_modules_cache.tar.gz..."
          gsutil cp node_modules_cache.tar.gz gs://${_CACHE_BUCKET}/cache/node_modules_cache.tar.gz
        else
          echo "Cache bucket not defined, skipping save."
        fi
    waitFor: ['build-client', 'run-server-tests']

  # ------------------------------------------------------------------------------
  # KROK 5: Volitelný a podmíněný Deploy (Firebase + Cloud Run)
  # Spouští se pouze pokud se jedná o push do větve "master" (nebo "main")
  # ------------------------------------------------------------------------------
  
  # A. DEPLOY FRONTENDU NA FIREBASE HOSTING
  # Tento krok vyžaduje, aby byl v tajnostech (Secret Manager) uložen FIREBASE_TOKEN
  # nebo aby měl service account příslušná IAM oprávnění pro Firebase.
  # Pro aktivaci odkomentujte následující blok:
  #
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   id: 'deploy-firebase'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       if [ "$BRANCH_NAME" = "master" ]; then
  #         echo "Deploying client to Firebase Hosting..."
  #         npm install -g firebase-tools
  #         firebase deploy --only hosting --token $$FIREBASE_TOKEN
  #       else
  #         echo "Not master branch ($BRANCH_NAME), skipping Firebase deploy."
  #       fi
  #   secretEnv: ['FIREBASE_TOKEN']
  #   waitFor: ['build-client']

  # B. DEPLOY BACKENDU NA GOOGLE CLOUD RUN (DOCKER BUILD & DEPLOY)
  # Tento krok zkompiluje Docker image a nasadí jej na Cloud Run.
  # Nahraďte 'europe-west3' a 'nexus-backend' za vaše lokality/názvy služeb.
  # Pro aktivaci odkomentujte následující blok:
  #
  # - name: 'gcr.io/cloud-builders/docker'
  #   id: 'docker-build-and-push'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       if [ "$BRANCH_NAME" = "master" ]; then
  #         docker build -t gcr.io/$PROJECT_ID/nexus-backend:$COMMIT_SHA -f server/Dockerfile server/
  #         docker push gcr.io/$PROJECT_ID/nexus-backend:$COMMIT_SHA
  #       else
  #         echo "Not master branch ($BRANCH_NAME), skipping Docker build."
  #       fi
  #   waitFor: ['run-server-tests']
  #
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   id: 'deploy-cloud-run'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       if [ "$BRANCH_NAME" = "master" ]; then
  #         gcloud run deploy nexus-backend \
  #           --image gcr.io/$PROJECT_ID/nexus-backend:$COMMIT_SHA \
  #           --region europe-west3 \
  #           --platform managed \
  #           --allow-unauthenticated
  #       else
  #         echo "Not master branch ($BRANCH_NAME), skipping Cloud Run deploy."
  #       fi
  #   waitFor: ['docker-build-and-push']

# ------------------------------------------------------------------------------
# Nastavení build parametrů a timeoutů
# ------------------------------------------------------------------------------
options:
  logging: CLOUD_LOGGING_ONLY
  volumes:
    - name: 'npm-cache'
      path: '/root/.npm'

# Substituce (proměnné, které lze předat při spuštění buildu)
substitutions:
  _CACHE_BUCKET: '' # Zde vyplňte název GCS bucketu pro ukládání cache (např. 'my-build-cache-bucket')

# Tajné proměnné ze Secret Manageru (použito pro Firebase token)
# availableSecrets:
#   secretManager:
#     - versionName: projects/$PROJECT_ID/secrets/FIREBASE_TOKEN/versions/latest
#       env: 'FIREBASE_TOKEN'
