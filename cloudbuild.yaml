# ================================================================================
# cloudbuild.yaml — Google Cloud Build Production Pipeline for Nexus Hub
# ================================================================================

steps:
  # ------------------------------------------------------------------------------
  # KROK 0: Obnovení cache závislostí z Google Cloud Storage
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'restore-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -z "${_CACHE_BUCKET}" ]; then
          echo "Restoring cache from gs://${_CACHE_BUCKET}..."
          gsutil cp gs://${_CACHE_BUCKET}/cache/node_modules_cache.tar.gz . || echo "No cache found"
          if [ -f node_modules_cache.tar.gz ]; then
            tar -xzf node_modules_cache.tar.gz
            echo "Cache restored successfully."
          fi
        else
          echo "Cache bucket not defined, skipping restore."
        fi
    waitFor: ['-']

  # ------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------
  # KROK 1: Clean Install závislostí
  # ------------------------------------------------------------------------------
  # A. Klientská část (React)
  - name: 'node:22'
    id: 'install-client'
    dir: 'client'
    entrypoint: 'npm'
    args: ['ci', '--legacy-peer-deps']
    waitFor: ['restore-cache']

  # B. Serverová část (NodeJS / Express / Prisma)
  - name: 'node:22'
    id: 'install-server'
    dir: 'server'
    entrypoint: 'npm'
    args: ['ci']
    waitFor: ['restore-cache']

  # C. Kořenový adresář (pro Playwright)
  - name: 'node:22'
    id: 'install-root'
    entrypoint: 'npm'
    args: ['ci']
    waitFor: ['restore-cache']

  # ------------------------------------------------------------------------------
  # KROK 2: Linter a Typová kontrola
  # ------------------------------------------------------------------------------
  # A. Linter klientské části
  - name: 'node:22'
    id: 'lint-client'
    dir: 'client'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor: ['install-client']

  # B. Linter serverové části
  - name: 'node:22'
    id: 'lint-server'
    dir: 'server'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor: ['install-server']

  # ------------------------------------------------------------------------------
  # KROK 3: Integrace Secret Manageru & QA Unit/Integration testy
  # ------------------------------------------------------------------------------
  # Spuštění backend testů s injektovanými tajnými proměnnými z Secret Manageru
  - name: 'node:22'
    id: 'run-server-tests'
    dir: 'server'
    entrypoint: 'npm'
    args: ['run', 'test:ci']
    secretEnv: ['DATABASE_URL', 'DEVICE_SECRET']
    waitFor: ['install-server', 'lint-server']

  # ------------------------------------------------------------------------------
  # KROK 4: Sestavení produkčního frontendu
  # ------------------------------------------------------------------------------
  - name: 'node:22'
    id: 'build-client'
    dir: 'client'
    entrypoint: 'npm'
    args: ['run', 'build']
    waitFor: ['install-client', 'lint-client']

  # ------------------------------------------------------------------------------
  # KROK 5: Příprava tajných klíčů pro odesílání commit statusů
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-github-token'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret="GITHUB_TOKEN" > /workspace/github_token.txt 2>/dev/null || echo "" > /workspace/github_token.txt
    waitFor: ['-']

  # ------------------------------------------------------------------------------
  # KROK 5.5: Úpravy build.gradle v node_modules pro kompatibilitu s Gradle 9+
  # ------------------------------------------------------------------------------
  - name: 'node:22'
    id: 'patch-gradle-compat'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Patching jcenter() to mavenCentral() in node_modules build.gradle files..."
        find client/node_modules -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        echo "Patching proguard-android.txt to proguard-android-optimize.txt..."
        find client/node_modules -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
    waitFor: ['install-client']

  # ------------------------------------------------------------------------------
  # KROK 6: Sestavení Android APK (Capacitor)
  # ------------------------------------------------------------------------------
  # A. Synchronizace Capacitor aktiv do nativního Android projektu
  - name: 'node:22'
    id: 'capacitor-sync'
    dir: 'client'
    entrypoint: 'npx'
    args: ['cap', 'sync', 'android']
    waitFor: ['build-client']

  # B. Kompilace debug APK pomocí Gradle v Android SDK prostředí
  - name: 'mobiledevops/android-sdk-image:34.0.1'
    id: 'build-android-apk'
    dir: 'client/android'
    entrypoint: './gradlew'
    args: ['assembleNexusRelayDebug']
    waitFor: ['capacitor-sync', 'patch-gradle-compat']

  # ------------------------------------------------------------------------------
  # KROK 7: Firebase Test Lab (Robo QA testování na reálném zařízení)
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'firebase-test-lab'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Starting Firebase Test Lab Robo test..."
        gcloud firebase test android run \
          --type robo \
          --app client/android/app/build/outputs/apk/nexusRelay/debug/app-nexusRelay-debug.apk \
          --device model=redfin,version=30,locale=cs,orientation=portrait \
          --timeout 3m
    waitFor: ['build-android-apk']

  # ------------------------------------------------------------------------------
  # KROK 8: Deploy frontendu na Firebase Hosting (Staging / PR Preview / Production)
  # ------------------------------------------------------------------------------
  - name: 'node:22'
    id: 'deploy-firebase'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "$TAG_NAME" ]; then
          echo "Deploying Production frontend to Firebase Hosting (nexus-systems-web-zd)..."
          npm install -g firebase-tools
          
          # Vybrat aktivní Firebase projekt
          firebase use nexus-systems-web-zd --token $$FIREBASE_TOKEN
          
          firebase deploy --only hosting --project=nexus-systems-web-zd --token $$FIREBASE_TOKEN
        elif [ -n "$_PR_NUMBER" ]; then
          echo "Deploying preview channel for PR #$_PR_NUMBER..."
          npm install -g firebase-tools
          
          # Vybrat aktivní Firebase projekt
          firebase use $PROJECT_ID --token $$FIREBASE_TOKEN
          
          # Deploy a uložení výstupu do JSONu
          DEPLOY_OUT=$$(firebase hosting:channel:deploy pr-$_PR_NUMBER --project=$PROJECT_ID --token $$FIREBASE_TOKEN --json)
          export PREVIEW_URL=$$(echo "$$DEPLOY_OUT" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf-8'));
            console.log(Object.values(data.result)[0].url);
          ")
          echo "Preview URL: $$PREVIEW_URL"
          
          # Zápis statusu do GitHubu
          export GITHUB_TOKEN=$$(cat /workspace/github_token.txt)
          if [ -n "$$GITHUB_TOKEN" ]; then
            echo "Odesílám commit status na GitHub..."
            node -e "
              const token = process.env.GITHUB_TOKEN;
              const url = 'https://api.github.com/repos/' + process.env.REPO_FULL_NAME + '/statuses/' + process.env.COMMIT_SHA;
              fetch(url, {
                method: 'POST',
                headers: {
                  'Authorization': 'token ' + token,
                  'Accept': 'application.vnd.github.v3+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Google-Cloud-Build'
                },
                body: JSON.stringify({
                  state: 'success',
                  target_url: process.env.PREVIEW_URL,
                  description: 'Firebase Hosting Preview deployed!',
                  context: 'deploy/firebase-preview'
                })
              }).then(res => {
                if (!res.ok) console.error('Chyba GitHub API status:', res.status);
              }).catch(console.error);
            "
          else
            echo "Žádný GITHUB_TOKEN v Secret Manageru, přeskakuji odeslání statusu."
          fi
        elif [ "$BRANCH_NAME" = "master" ] || [ "$BRANCH_NAME" = "main" ]; then
          echo "Deploying Staging frontend to Firebase Hosting ($PROJECT_ID)..."
          npm install -g firebase-tools
          
          # Vybrat aktivní Firebase projekt
          firebase use $PROJECT_ID --token $$FIREBASE_TOKEN
          
          firebase deploy --only hosting --project=$PROJECT_ID --token $$FIREBASE_TOKEN
        else
          echo "Skipping Firebase deploy for branch $BRANCH_NAME"
        fi
    env:
      - 'REPO_FULL_NAME=$REPO_FULL_NAME'
      - 'COMMIT_SHA=$COMMIT_SHA'
    secretEnv: ['FIREBASE_TOKEN']
    waitFor: ['build-client', 'get-github-token']

  # ------------------------------------------------------------------------------
  # KROK 9: Sestavení Docker image backendu (Staging / Production)
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "$TAG_NAME" ]; then
          echo "Building Production Docker image (nexus-systems-web-zd)..."
          docker build -t europe-west3-docker.pkg.dev/nexus-systems-web-zd/nexus-repo/nexus-backend:$TAG_NAME -f server/Dockerfile server/
          docker push europe-west3-docker.pkg.dev/nexus-systems-web-zd/nexus-repo/nexus-backend:$TAG_NAME
        elif [ "$BRANCH_NAME" = "master" ] || [ "$BRANCH_NAME" = "main" ]; then
          echo "Building Staging Docker image ($PROJECT_ID)..."
          docker build -t europe-west3-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-backend:$COMMIT_SHA -f server/Dockerfile server/
          docker push europe-west3-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-backend:$COMMIT_SHA
        fi
    waitFor: ['run-server-tests']

  # ------------------------------------------------------------------------------
  # KROK 10: Nasazení backendu na Cloud Run (Staging / Production)
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "$TAG_NAME" ]; then
          echo "Deploying Production backend to Cloud Run (nexus-systems-web-zd)..."
          gcloud run deploy nexus-backend \
            --image europe-west3-docker.pkg.dev/nexus-systems-web-zd/nexus-repo/nexus-backend:$TAG_NAME \
            --region europe-west3 \
            --platform managed \
            --project nexus-systems-web-zd \
            --set-env-vars=NODE_ENV=production \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,DEVICE_SECRET=DEVICE_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest \
            --allow-unauthenticated
        elif [ "$BRANCH_NAME" = "master" ] || [ "$BRANCH_NAME" = "main" ]; then
          echo "Deploying Staging backend to Cloud Run ($PROJECT_ID)..."
          gcloud run deploy nexus-backend \
            --image europe-west3-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-backend:$COMMIT_SHA \
            --region europe-west3 \
            --platform managed \
            --project $PROJECT_ID \
            --set-env-vars=NODE_ENV=production \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,DEVICE_SECRET=DEVICE_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest \
            --allow-unauthenticated
        fi
    waitFor: ['docker-build']

  # ------------------------------------------------------------------------------
  # KROK 11: Spuštění Playwright E2E testů nad Staging prostředím (Pouze Push)
  # ------------------------------------------------------------------------------
  - name: 'mcr.microsoft.com/playwright:v1.49.0-noble'
    id: 'run-playwright-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "$TAG_NAME" ]; then
          echo "Skipping Staging E2E tests for Production Tag deployment."
        elif [ "$BRANCH_NAME" = "master" ] || [ "$BRANCH_NAME" = "main" ]; then
          echo "Spouštím Playwright testy nad Staging prostředím..."
          npm run test:smoke
        else
          echo "Skipping Playwright tests for branch $BRANCH_NAME"
        fi
    env:
      - 'FRONTEND_URL=https://nexus-sync-8d50b.web.app'
      - 'CI=true'
    waitFor: ['install-root', 'deploy-firebase', 'deploy-cloud-run']

  # ------------------------------------------------------------------------------
  # KROK 12: Uložení aktualizované cache závislostí
  # ------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'save-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -z "${_CACHE_BUCKET}" ]; then
          echo "Saving cache to gs://${_CACHE_BUCKET}..."
          tar -czf node_modules_cache.tar.gz client/node_modules server/node_modules node_modules
          gsutil cp node_modules_cache.tar.gz gs://${_CACHE_BUCKET}/cache/node_modules_cache.tar.gz
        else
          echo "Cache bucket not defined, skipping save."
        fi
    waitFor: ['run-server-tests', 'firebase-test-lab', 'run-playwright-tests']

# ------------------------------------------------------------------------------
# Konfigurace a Integrace Secret Manageru
# ------------------------------------------------------------------------------
options:
  logging: CLOUD_LOGGING_ONLY
  volumes:
    - name: 'npm-cache'
      path: '/root/.npm'

# Mapování Secret Manager klíčů na environmentální proměnné v build krocích
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/DEVICE_SECRET/versions/latest
      env: 'DEVICE_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_TOKEN/versions/latest
      env: 'FIREBASE_TOKEN'

substitutions:
  _CACHE_BUCKET: '' # Název vašeho GCS bucketu pro cache
